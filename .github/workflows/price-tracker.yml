
name: Product Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  track-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Track product price
        env:
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
          TARGET_PRICE: ${{ vars.TARGET_PRICE }}
        run: python tracker.py

      - name: Save price history
        if: always()
        run: |
          if [ -f price_history.csv ] && [ -n "$(git status --porcelain price_history.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add price_history.csv
            git commit -m "Update price history" || true
            git push
          fi
