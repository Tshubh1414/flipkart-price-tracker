name: Product Price Tracker

on:
  schedule:
    # GitHub scheduled workflows have a 5-minute minimum interval.
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track-price:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository and existing history
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check product price
        env:
          PRODUCT_URL: ${{ vars.PRODUCT_URL }}
          TARGET_PRICE: ${{ vars.TARGET_PRICE }}
        run: python tracker.py

      - name: Commit updated history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f price_history.csv ]; then
            git add price_history.csv
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update product price history"
              git push
            else
              echo "No history changes to commit."
            fi
          else
            echo "No history file was created."
          fi
